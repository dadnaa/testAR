<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AR Demo</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin:0; display:flex; flex-direction:column; min-height:100vh; }
      main { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; }
      model-viewer { width:100%; max-width:800px; height:70vh; border-radius:12px; }
      .note { text-align:center; padding:12px 16px; }
    </style>
  </head>
  <body>
    <main>
      <model-viewer
        id="mv"
        src="models/pizza_bigboss_pancho.glb"
        ios-src="models/pizza_bigboss_pancho.usdz"
        alt="Pizza"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        style="background:#fff;">
      </model-viewer>
    </main>

    <div class="note">
      <small>
        On a mobile device: tap the AR button to place the model on your table. If AR doesn't appear, try Chrome on Android or Safari on iOS.
      </small>
    </div>
  </body>
</html>
